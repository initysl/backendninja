# A shared (proxy) cache sitting in front of the Express server.
# This is what the exercise needs: curl is not a cache, so without something
# like this you can only show that the endpoint returns two different bodies —
# not that a cache hands the wrong one to the wrong client.
events {}

http {
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=demo:10m;

  server {
    listen 80;

    location / {
      proxy_pass http://host.docker.internal:3000;

      proxy_cache demo;
      proxy_cache_valid 200 1h;

      # The default cache key is scheme + host + request_uri. Note what is NOT
      # in it: request headers. A response that varies by Accept is only stored
      # separately if it says so with `Vary: Accept`.
      # nginx honours Vary when present — which is exactly why omitting it poisons the cache.

      add_header X-Cache-Status $upstream_cache_status;
    }
  }
}
