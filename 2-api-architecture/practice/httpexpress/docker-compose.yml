# Start the Express server on the host first (npm run etag -w api-architecture-practice),
# then `docker compose up -d` here. The cache listens on :8080 and proxies to :3000.
services:
  cache:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Lets the container reach the Express server running on the host.
      - 'host.docker.internal:host-gateway'
